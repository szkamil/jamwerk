<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    a { color: #9a7bff; } a:hover { color: #b8a2ff; }
  </style>
</helmet>
<div style="width: 390px; height: 620px; background: #0d0c12; color: #e8e6f2; display: flex; flex-direction: column; gap: 14px; padding: 20px; overflow: hidden;">
  <div style="font-size: 13px; color: #8b87a3; letter-spacing: 0.08em; text-transform: uppercase;">Alternate B — Stage dark</div>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 22px; font-weight: 800;">Jam<span style="color: #9a7bff;">Werk</span></div>
    <div style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px dashed #4a4661;"></div>
  </div>
  <div style="display: flex; gap: 6px;">
    <div style="flex: 1; border: 1.5px solid #9a7bff; border-radius: 999px; padding: 10px 0; text-align: center; font-size: 13px; color: #b8a2ff;">Paid gigs</div>
    <div style="flex: 1; border: 1.5px dashed #4a4661; border-radius: 999px; padding: 10px 0; text-align: center; font-size: 13px; color: #8b87a3;">Practice</div>
  </div>
  <div style="border: 1.5px dashed #4a4661; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #14121d;">
    <div style="display: flex; justify-content: space-between;">
      <div style="width: 90px; height: 16px; background: #2a2740; border-radius: 4px;"></div>
      <div style="width: 70px; height: 16px; background: #9a7bff; border-radius: 4px;"></div>
    </div>
    <div style="width: 60%; height: 10px; background: #2a2740; border-radius: 4px;"></div>
    <div style="width: 85%; height: 10px; background: #2a2740; border-radius: 4px;"></div>
    <div style="height: 40px; background: #9a7bff; border-radius: 10px; opacity: 0.85;"></div>
  </div>
  <div style="border: 1.5px dashed #4a4661; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #14121d;">
    <div style="display: flex; justify-content: space-between;">
      <div style="width: 110px; height: 16px; background: #2a2740; border-radius: 4px;"></div>
      <div style="width: 70px; height: 16px; background: #9a7bff; border-radius: 4px;"></div>
    </div>
    <div style="width: 70%; height: 10px; background: #2a2740; border-radius: 4px;"></div>
  </div>
  <div style="margin-top: auto; font-size: 12.5px; color: #8b87a3; line-height: 1.5;">Club-night mood: near-black surfaces, glowing violet, high contrast. Feels like the gig itself; can read heavy in daylight use.</div>
</div>
</x-dc>
</body>
</html>
