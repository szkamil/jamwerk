# JamWerk — gig marketplace for musicians (dep booking).
# Own Worker + own D1 database, served at jamwerk.app.
name = "jamwerk"
main = "src/index.ts"
# Newest date this repo's Wrangler (4.66) actually runs. A later date is
# silently downgraded by the bundled workerd (max 2025-02-04), so tests would
# not be exercising it.
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "jamwerk.app", custom_domain = true },
  { pattern = "www.jamwerk.app", custom_domain = true }
]

[triggers]
# Daily housekeeping (see scheduled() in src/index.ts)
crons = ["17 3 * * *"]

[observability]
enabled = true

# Profile photos (client-resized JPEGs, served at /img/<key>).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jamwerk-media"

[[d1_databases]]
binding = "DB"
database_name = "jamwerk-db"
database_id = "9b956c5a-b8e2-41e4-930c-8a647501b6cb"

[vars]
BASE_URL = "https://jamwerk.app"
# Sender for Mailjet — JamWerk's own dedicated Mailjet account (login
# gigwerk@hotmail.com, account name "Gig Werk"), NOT the TrustAxis account.
# jamwerk.app is validated (ownership via DNS record, 2026-08-22) and
# authenticated (SPF/DKIM OK, DMARC p=none) in that account, so mail goes out
# DKIM-signed from notify@jamwerk.app. Sends are skipped when EMAIL_FROM is unset.
EMAIL_FROM = "notify@jamwerk.app"
# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   JWT_SECRET          — session cookie signing key (rotated 2026-08-22)
#   VAPID_PUBLIC_KEY    — Web Push VAPID public key (base64url, P-256 raw)
#   VAPID_PRIVATE_JWK   — matching private key as a JWK string
#   MAILJET_API_KEY / MAILJET_SECRET_KEY / TURNSTILE_SECRET_KEY
# Rotating the VAPID pair invalidates existing push subscriptions (users just
# re-enable alerts).
VAPID_SUBJECT = "mailto:notify@jamwerk.app"

# Footer feedback form submissions are stored in D1 and forwarded here by
# email (once the Mailjet keys are configured — see README "Email").
FEEDBACK_EMAIL = "rupert.szewczyk@gmail.com"
# Same operator inbox, set explicitly so admin access does not depend on the
# feedback address staying in place. isAdmin() still falls back to FEEDBACK_EMAIL.
ADMIN_EMAIL = "rupert.szewczyk@gmail.com"

# Self-hosted woff2 subsets (src/fonts). fallthrough keeps .ts compilation.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true
