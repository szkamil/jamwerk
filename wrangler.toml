# JamWerk — gig marketplace for musicians (dep booking).
# Own Worker + own D1 database, served at jamwerk.app.
name = "jamwerk"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "jamwerk.app", custom_domain = true },
  { pattern = "www.jamwerk.app", custom_domain = true }
]

[triggers]
# Daily housekeeping (see scheduled() in src/index.ts)
crons = ["17 3 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "jamwerk-db"
database_id = "9b956c5a-b8e2-41e4-930c-8a647501b6cb"

[vars]
BASE_URL = "https://jamwerk.app"
# Sender for Mailjet — JamWerk's own dedicated Mailjet account (login
# gigwerk@hotmail.com, account name "Gig Werk"), NOT the TrustAxis account.
# jamwerk.app is validated + SPF/DKIM/DMARC-authenticated in that account
# (SPF OK / DKIM OK; records in the Cloudflare zone) but Mailjet's domain
# OWNERSHIP check still shows Pending (2026-08-22) and mail from
# notify@jamwerk.app was silently dropped. Keep the validated address sender
# until the domain row shows Active, then set EMAIL_FROM = "notify@jamwerk.app".
EMAIL_FROM = "gigwerk@hotmail.com"
# POC only: plaintext var so the workers.dev deploy needs no secret setup.
# Before this app gets a real domain and real users, move it to
# `wrangler secret put JWT_SECRET` and rotate.
JWT_SECRET = "jamwerk-poc-fb42e697ffab16f5f43ed3e097fe7817"

# Web Push VAPID keys. POC only: like JWT_SECRET above, kept as plaintext vars
# for the workers.dev-era deploy; move both to `wrangler secret put` before
# real users (rotating them just re-prompts everyone to re-enable alerts).
VAPID_PUBLIC_KEY = "BNfGECx3PmeosUqaIXYTczj4LiKUIMfr7y-65lCgP8fxOmWeN2xiqZELdHC04zWL883xEgESnfGN9cas_XEA2-o"
VAPID_PRIVATE_JWK = '{"key_ops":["sign"],"ext":true,"kty":"EC","x":"18YQLHc-Z6ixSpohdhNzOPguIpQgx-vvL7rmUKA_x_E","y":"OmWeN2xiqZELdHC04zWL883xEgESnfGN9cas_XEA2-o","crv":"P-256","d":"bNwu0WkiUbXr7CMi0M8zPfC4wfE5PUs2Tq7sR1iNC7Q"}'
VAPID_SUBJECT = "mailto:rupert.szewczyk@gmail.com"

# Footer feedback form submissions are stored in D1 and forwarded here by
# email (once the Mailjet keys are configured — see README "Email").
FEEDBACK_EMAIL = "rupert.szewczyk@gmail.com"
